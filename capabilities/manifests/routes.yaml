id: routes
description: >-
  Plan trips, transit and driving routes, and answer ETA questions with a
  complete live picture: journey steps with actual bus line numbers, live
  next-departure minutes from the exact stop, total time, and a map link.
  Ask like "when is my next bus from Tampines?", "route from Raffles Place to
  Changi Airport", or "how long is the drive to KL".
input_schema:
  type: object
  properties:
    origin:
      type: string
      description: Starting place (optional; defaults from profile/context).
    destination:
      type: string
      description: Destination place.
    mode:
      type: string
      description: transit, driving, walking, or bicycling.
  required: []
output_schema:
  type: object
  properties:
    route:
      type: object
      description: Origin, destination, ETA in minutes, distance, steps.
  required: [route]
side_effect: read
tags: [transit, commute, bus, mrt, travel]
managers: [life, travel]
preconditions:
  - "Route provider configured (optional for offline fallback)"
cost_hint: medium
