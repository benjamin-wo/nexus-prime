id: reminders
description: >-
  Set, list and delete reminders and scheduled tasks in plain language: every
  N hours, daily at a time, on a weekday, or "about this on Friday". Ask like
  "remind me to drink water every 2 hours", "remind me about this on Friday",
  or "delete reminder 3".
input_schema:
  type: object
  properties:
    text:
      type: string
      description: Natural-language reminder request.
  required: [text]
output_schema:
  type: object
  properties:
    job:
      type: object
      description: Scheduled job with cron expression and next run.
  required: [job]
side_effect: write
tags: [reminders, scheduling]
managers: [life, home]
preconditions:
  - "Scheduler is running"
cost_hint: low
