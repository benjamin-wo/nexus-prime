id: expenses
description: >-
  Record, list, split and summarise your spending: log an expense from text or a
  receipt photo, split dinner or group outing bills among friends with copy-pastable WhatsApp/Telegram text and 1-tap IOU collection tasks, list recent expenses, and answer how much you spent or where
  the money went. Ask like "spent $12.50 at Starbucks", "split $160 at Haidilao with Alex, Chloe, Ben and me", "show my expenses",
  or "how much did I spend on food last month".
input_schema:
  type: object
  properties:
    text:
      type: string
      description: Natural-language expense description, receipt caption, bill splitting request, or listing request.
    image:
      type: string
      description: Optional base64 receipt photo.
  required: []
output_schema:
  type: object
  properties:
    message:
      type: string
      description: Confirmation, listing, or clarification question.
    status:
      type: string
  required: [message]
side_effect: write
tags: [money, spending, receipts, budget, split, "split bill", iou]
managers: [finance, life]
preconditions:
  - "User profile exists"
cost_hint: medium
