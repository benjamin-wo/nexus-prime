id: code_exec
description: >-
  Run a short Python snippet in an isolated sandbox with no network access to
  unauthorised hosts, no secret environment, a hard timeout, and no access to
  the credential vault. Use for calculations, data reshaping, and safe
  experiments only.
input_schema:
  type: object
  properties:
    code:
      type: string
      description: Python source to execute (the only executable input).
    data:
      type: object
      description: Read-only data payload; never executed.
  required: [code]
output_schema:
  type: object
  properties:
    output:
      type: string
    error:
      type: string
  required: [output]
side_effect: write
tags: [code, sandbox, compute]
managers: [life]
preconditions:
  - "Sandbox provider configured (local fallback or E2B)"
cost_hint: medium
