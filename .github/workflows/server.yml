name: Server

# Run one fixed action on the Kaya server over SSH, by hand (Actions tab → Server →
# Run workflow) or from a tool. The key can only run deploy/remote.sh (a forced
# command), so this workflow can't run anything else there. See deploy/README.md.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do on the server
        type: choice
        options: [health, status, deploy, restart]
        default: health

permissions:
  contents: read

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ${{ inputs.action }}
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          ACTION: ${{ inputs.action }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$HOST" "$ACTION"
