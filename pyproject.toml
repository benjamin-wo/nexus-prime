[project]
name = "nexus-prime"
version = "0.1.0"
description = "Personal finance assistant: Telegram capture and a web cockpit over one agent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "cryptography>=43",
    "fastapi>=0.115",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph==1.2.12",
    "langgraph-checkpoint==4.2.0",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35",
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs a real Postgres (TEST_DATABASE_URL)"]
