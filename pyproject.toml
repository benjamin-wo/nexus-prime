[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-prime"

version = "0.1.0"
description = "High-performance, single-user Personal Assistant Telegram Bot on Railway with 3-Layer Plugin Architecture and LangGraph Multi-Agent Orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

authors = [
    { name = "Antigravity Engineering", email = "assistant@example.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.28",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-openai>=0.2.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "tzdata>=2024.1",
    "pgvector>=0.2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "capabilities*", "orchestrator*"]
