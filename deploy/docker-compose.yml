# Nexus on one small server: the app, its Postgres, and Caddy for HTTPS.
# Run from this folder:  docker compose up -d --build
# Settings live in deploy/.env (never committed); see deploy/README.md.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: kaya
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kaya"]
      interval: 5s
      retries: 20

  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/kaya
      WEB_ORIGIN: https://${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
      PORT: "8000"
    # Migrate, then serve (Railway ran the migration as a pre-deploy step).
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn --factory nexus.main:create_app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
